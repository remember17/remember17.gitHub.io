付款&#34;,&#34;en&#34;:&#34;Payment&#34;}" data-astro-cid-efsidoll> 付款 </a> </li><li data-astro-cid-efsidoll> <a href="#section-7" data-lang-copy="{&#34;zh&#34;:&#34;续订&#34;,&#34;en&#34;:&#34;Renewal&#34;}" data-astro-cid-efsidoll> 续订 </a> </li><li data-astro-cid-efsidoll> <a href="#section-9" data-lang-copy="{&#34;zh&#34;:&#34;取消订阅&#34;,&#34;en&#34;:&#34;Cancel subscription&#34;}" data-astro-cid-efsidoll> 取消订阅 </a> </li> </ol> </nav> <h2 id="section-1" data-legal-body-block="heading" data-lang-copy="{&#34;zh&#34;:&#34;订阅周期&#34;,&#34;en&#34;:&#34;Subscription period&#34;}">订阅周期</h2><ul data-legal-body-block="bullets"><li data-lang-copy="{&#34;zh&#34;:&#34;1 个月（连续包月）&#34;,&#34;en&#34;:&#34;1 month (auto-renewable monthly)&#34;}">1 个月（连续包月）</li><li data-lang-copy="{&#34;zh&#34;:&#34;12 个月（连续包年）&#34;,&#34;en&#34;:&#34;12 months (auto-renewable yearly)&#34;}">12 个月（连续包年）</li></ul><h2 id="section-3" data-legal-body-block="heading" data-lang-copy="{&#34;zh&#34;:&#34;订阅价格&#34;,&#34;en&#34;:&#34;Subscription price&#34;}">订阅价格</h2><p data-legal-body-block="paragraph" data-lang-copy="{&#34;zh&#34;:&#34;以 iAP 申请信息为准。&#34;,&#34;en&#34;:&#34;As listed in the In-App Purchase (IAP) application.&#34;}">以 iAP 申请信息为准。</p><h2 id="section-5" data-legal-body-block="heading" data-lang-copy="{&#34;zh&#34;:&#34;付款&#34;,&#34;en&#34;:&#34;Payment&#34;}">付款</h2><p data-legal-body-block="paragraph" data-lang-copy="{&#34;zh&#34;:&#34;确认购买并付款后记入 iTunes（Apple ID）账户。&#34;,&#34;en&#34;:&#34;After you confirm purchase and pay, the charge is applied to your iTunes (Apple ID) account.&#34;}">确认购买并付款后记入 iTunes（Apple ID）账户。</p><h2 id="section-7" data-legal-body-block="heading" data-lang-copy="{&#34;zh&#34;:&#34;续订&#34;,&#34;en&#34;:&#34;Renewal&#34;}">续订</h2><p data-legal-body-block="paragraph" data-lang-copy="{&#34;zh&#34;:&#34;苹果 iTunes 账户会在到期前 24 小时内扣费，扣费成功后订阅周期顺延一个订阅周期。&#34;,&#34;en&#34;:&#34;Your Apple iTunes account will be charged within 24 hours before expiry; after successful payment the subscription period renews for another period.&#34;}">苹果 iTunes 账户会在到期前 24 小时内扣费，扣费成功后订阅周期顺延一个订阅周期。</p><h2 id="section-9" data-legal-body-block="heading" data-lang-copy="{&#34;zh&#34;:&#34;取消订阅&#34;,&#34;en&#34;:&#34;Cancel subscription&#34;}">取消订阅</h2><p data-legal-body-block="paragraph" data-lang-copy="{&#34;zh&#34;:&#34;如需取消续订，请在当前订阅周期到期前 24 小时以前，手动在 iTunes / Apple ID 设置管理中关闭自动续订功能。&#34;,&#34;en&#34;:&#34;To cancel renewal, manually turn off auto-renewal in iTunes / Apple ID settings at least 24 hours before the current subscription period ends.&#34;}">如需取消续订，请在当前订阅周期到期前 24 小时以前，手动在 iTunes / Apple ID 设置管理中关闭自动续订功能。</p> </div> </article> </main> </body></html>
